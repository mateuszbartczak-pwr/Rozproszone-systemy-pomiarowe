; Laboratorium 4 (Przetwarzanie brzegowe): TinyML na ESP32 -- BMP280 + TensorFlow Lite for Microcontrollers
; Pierwsza kompilacja trwa 4-5 minut (biblioteka TFLM), kolejne ok. 20 s.
; Wersja platformy przypięta: z najnowszą część stanowisk nie budowała projektu.

[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino

lib_deps =
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit BMP280 Library@^2.6.8
	tanakamasayuki/TensorFlowLite_ESP32@^1.0.0

upload_speed = 460800
monitor_speed = 115200
