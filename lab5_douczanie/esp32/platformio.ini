; Laboratorium 5 (Przetwarzanie brzegowe): douczanie modelu na ESP32 -- sieć 2-4-2 w C++ (float), bez TFLM.
; Jeśli w Twoim platformio.ini z Laboratorium 4 jest biblioteka TensorFlowLite_ESP32, może zostać (nie przeszkadza).

[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino

lib_deps =
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit BMP280 Library@^2.6.8

upload_speed = 460800
monitor_speed = 115200
