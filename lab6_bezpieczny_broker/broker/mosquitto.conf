# Laboratorium 6: broker z kontami, listą kontroli dostępu (ACL) i TLS dla klientów spoza Dockera.
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Te same zasady (hasła, ACL) na obu portach
per_listener_settings false
# Bez anonimowych klientów: każdy musi podać login i hasło
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
# Uwaga: ustawienia listenera (np. use_username_as_clientid) wpisane PRZED pierwszą linią "listener" tworzą
# ukryty domyślny listener na porcie 1883 -- broker kończy się wtedy błędem "Address in use".

# 1883: bez szyfrowania -- tylko wewnątrz sieci Dockera (ingestor, symulator). Nie publikuj go na zewnątrz.
listener 1883
# Client ID = login: nikt nie przejmie cudzej sesji, podając cudzy Client ID
use_username_as_clientid true

# 8883: TLS dla klientów spoza Dockera (ESP32, MQTT Explorer). Pliki tworzy broker/przygotuj.sh.
listener 8883
use_username_as_clientid true
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/serwer.crt
keyfile /mosquitto/certs/serwer.key
tls_version tlsv1.2
