; Laboratorium 6 (Przetwarzanie brzegowe): ESP32 -> broker MQTT z kontem, ACL i TLS (WiFiClientSecure, mbedTLS).

[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino

lib_deps =
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit BMP280 Library@^2.6.8

upload_speed = 460800
monitor_speed = 115200
